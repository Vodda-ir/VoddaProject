name: vodda
description: "وُدّا — همراهِ یادگیری قرآن و مداحی"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state management
  flutter_riverpod: ^2.6.1

  # routing
  go_router: ^14.6.2

  # networking
  dio: ^5.7.0

  # local storage (token)
  shared_preferences: ^2.3.3

  # themed OTP input
  pinput: ^5.0.0

  # value equality
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: IRANYekanXFaNum
      fonts:
        - asset: assets/font/IRANYekanXFaNum-Thin.ttf
          weight: 100
        - asset: assets/font/IRANYekanXFaNum-UltraLight.ttf
          weight: 200
        - asset: assets/font/IRANYekanXFaNum-Light.ttf
          weight: 300
        - asset: assets/font/IRANYekanXFaNum-Regular.ttf
          weight: 400
        - asset: assets/font/IRANYekanXFaNum-Medium.ttf
          weight: 500
        - asset: assets/font/IRANYekanXFaNum-DemiBold.ttf
          weight: 600
        - asset: assets/font/IRANYekanXFaNum-Bold.ttf
          weight: 700
        - asset: assets/font/IRANYekanXFaNum-ExtraBold.ttf
          weight: 800
        - asset: assets/font/IRANYekanXFaNum-Black.ttf
          weight: 900
        - asset: assets/font/IRANYekanXFaNum-Heavy.ttf
          weight: 900
        - asset: assets/font/IRANYekanXFaNum-ExtraBlack.ttf
          weight: 900
