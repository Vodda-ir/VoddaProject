name: app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  http: ^1.6.0
  intl: ^0.20.2
  shamsi_date: ^1.1.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
  fonts:
    - family: IranYekan
      fonts:
        - asset: assets/font/IRANYekanXFaNum-Thin.ttf
          weight: 100
        - asset: assets/font/IRANYekanXFaNum-UltraLight.ttf
          weight: 200
        - asset: assets/font/IRANYekanXFaNum-Light.ttf
          weight: 300
        - asset: assets/font/IRANYekanXFaNum-Regular.ttf
          weight: 400
        - asset: assets/font/IRANYekanXFaNum-Medium.ttf
          weight: 500
        - asset: assets/font/IRANYekanXFaNum-DemiBold.ttf
          weight: 600
        - asset: assets/font/IRANYekanXFaNum-Bold.ttf
          weight: 700
        - asset: assets/font/IRANYekanXFaNum-ExtraBold.ttf
          weight: 800
        - asset: assets/font/IRANYekanXFaNum-Black.ttf
          weight: 900
