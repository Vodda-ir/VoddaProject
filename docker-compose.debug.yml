# Docker Compose for debug/test environment
# MySQL + Backend (hot-reload) + Main (hot-reload)

services:
  mysql:
    image: mysql:8.0
    container_name: vodda-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vodda
      MYSQL_USER: vodda
      MYSQL_PASSWORD: vodda
      MYSQL_ROOT_PASSWORD: vodda
    ports:
      - "3306:3306"
    volumes:
      - vodda_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pvodda"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.debug
    container_name: vodda-backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: vodda
      MYSQL_PASSWORD: vodda
      MYSQL_DATABASE: vodda
      BACKEND_PORT: "5566"
      JWT_ACCESS_SECRET: dev-secret
      JWT_REFRESH_SECRET: dev-refresh
    ports:
      - "5566:5566"
    volumes:
      - ./backend:/app
      - backend_tmp:/app/tmp
    depends_on:
      mysql:
        condition: service_healthy

  main:
    build:
      context: ./main
      dockerfile: Dockerfile.debug
    container_name: vodda-main
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5566
    ports:
      - "3000:3000"
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    volumes:
      - ./main:/app
      - main_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  vodda_mysql_data:
  backend_tmp:
  main_node_modules:
