name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Format check
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following Go files require gofmt:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

  frontend:
    name: Frontend · Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          SERVER_API_URL: http://127.0.0.1:3420/api/v1

  flutter:
    name: App · Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Apply booking lint fix
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/lib/features/sessions/presentation/booking_screen.dart')
          text = path.read_text()
          old = """      if ((wd is int ? wd : int.tryParse(wd.toString())) != persianWeekday)\n        continue;"""
          new = """      if ((wd is int ? wd : int.tryParse(wd.toString())) != persianWeekday) {\n        continue;\n      }"""
          if old not in text:
              raise SystemExit('expected booking lint pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
          dart format app/lib/features/sessions/presentation/booking_screen.dart
      - name: Commit one-time Flutter fix
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "Flutter source is already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/features/sessions/presentation/booking_screen.dart
          git commit -m "fix(app): satisfy booking flow lint"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
