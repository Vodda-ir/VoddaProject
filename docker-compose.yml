services:
  mysql:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: mysql:8.0
    command: ["--max_allowed_packet=512M", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - MYSQL_DATABASE=${DB_NAME:-vodda}
    ports:
      - "${MYSQL_PORT:-3422}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - vodda-network
    restart: unless-stopped

  backend:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - SERVER_PORT=${BACKEND_INTERNAL_PORT:-3420}
    image: vodda-backend:prod
    depends_on:
      - mysql
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=${BACKEND_INTERNAL_PORT:-3420}
      - APP_ENV=${APP_ENV:-production}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-https://vodda.ir}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=${DB_NAME:-vodda}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - TOKEN_EXPIRATION=${TOKEN_EXPIRATION:-720h}
      - OTP_EXPIRATION=${OTP_EXPIRATION:-2m}
      - OTP_RESEND_COOLDOWN=${OTP_RESEND_COOLDOWN:-2m}
      - SMS_PROVIDER=${SMS_PROVIDER:-sms.ir}
      - SMS_API_URL=${SMS_API_URL:-https://api.sms.ir/v1/send/verify}
      - SMS_API_KEY=${SMS_API_KEY:-}
      - SMS_BODY_ID=${SMS_BODY_ID:-0}
      - SMS_FARAZ_API_URL=${SMS_FARAZ_API_URL:-https://ippanel.com/patterns/pattern}
      - SMS_FARAZ_USERNAME=${SMS_FARAZ_USERNAME:-}
      - SMS_FARAZ_PASSWORD=${SMS_FARAZ_PASSWORD:-}
      - SMS_FARAZ_FROM=${SMS_FARAZ_FROM:-3000505}
      - SMS_FARAZ_PATTERN_CODE=${SMS_FARAZ_PATTERN_CODE:-j4skcu7fjd1jjjz}
      - SMS_REQUEST_TIMEOUT=${SMS_REQUEST_TIMEOUT:-20s}
      - OTP_TEST_BYPASS_ENABLED=${OTP_TEST_BYPASS_ENABLED:-false}
      - OTP_TEST_CODE=${OTP_TEST_CODE:-}
      - OTP_TEST_MOBILE=${OTP_TEST_MOBILE:-}
      - AUTO_SEED=${AUTO_SEED:-false}
      - ZARINPAL_MERCHANT_ID=${ZARINPAL_MERCHANT_ID:-}
      - ZARINPAL_SANDBOX=${ZARINPAL_SANDBOX:-false}
      - PLATFORM_COMMISSION_PERCENT=${PLATFORM_COMMISSION_PERCENT:-15}
    ports:
      - "${BACKEND_PORT:-3420}:${BACKEND_INTERNAL_PORT:-3420}"
    networks:
      - vodda-network
    restart: unless-stopped

  frontend:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - PORT=${FRONTEND_INTERNAL_PORT:-3421}
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        - NEXT_PUBLIC_UNIVERSAL_APP_BFF_BASE_URL=${NEXT_PUBLIC_UNIVERSAL_APP_BFF_BASE_URL:-/api/backend}
        - NEXT_PUBLIC_UNIVERSAL_APP_AUTH_BASE_URL=${NEXT_PUBLIC_UNIVERSAL_APP_AUTH_BASE_URL:-/api/auth}
        - SERVER_API_URL=${SERVER_API_URL:-http://backend:3420/api/v1}
    image: vodda-frontend:prod
    depends_on:
      - backend
    environment:
      - PORT=${FRONTEND_INTERNAL_PORT:-3421}
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      - SERVER_API_URL=${SERVER_API_URL:-http://backend:3420/api/v1}
    ports:
      - "${FRONTEND_PORT:-3421}:${FRONTEND_INTERNAL_PORT:-3421}"
    networks:
      - vodda-network
    restart: unless-stopped

  monafaseh:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ./monafaseh
      dockerfile: Dockerfile
      # بدون این، آخرین مرحله‌ی Dockerfile (migrator یک‌باره) به‌عنوان ایمیج ساخته می‌شود
      target: runner
    image: vodda-monafaseh:prod
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/db/custom.db
      - NEXTAUTH_SECRET=${MONAFASEH_NEXTAUTH_SECRET:-${JWT_SECRET:?JWT_SECRET is required}}
      - NEXTAUTH_URL=${MONAFASEH_NEXTAUTH_URL:-https://monafaseh.ir}
      - SITE_URL=${MONAFASEH_SITE_URL:-https://monafaseh.ir}
      - BOT_TOKEN=${MONAFASEH_BOT_TOKEN:-}
      - SAMAN_TERMINAL_ID=${SAMAN_TERMINAL_ID:-}
      - SAMAN_MERCHANT_ID=${SAMAN_MERCHANT_ID:-}
    ports:
      - "${MONAFASEH_PORT:-3423}:3000"
    volumes:
      - monafaseh_db:/app/db
      - monafaseh_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - vodda-network
    restart: unless-stopped

volumes:
  monafaseh_db:
    name: monafaseh_monafaseh-db
    driver: local
  monafaseh_uploads:
    name: monafaseh_monafaseh-uploads
    driver: local

networks:
  vodda-network:
    driver: bridge
